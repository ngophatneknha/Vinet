[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Explicitly enable the adapter for projects linked through the API as well as UI.
# Netlify installs the current supported version during the build.
[[plugins]]
  package = "./netlify/plugins/restore-dataset"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Enable Netlify Database and Identity in the dashboard before the first build.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
